name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: wowlua_ls
            # The oldest glibc the binary may need: Rust's own minimum for
            # this target, so it starts on every glibc distro Rust supports
            # (Ubuntu 14.04+, Debian 8+, RHEL/CentOS 7+). A row with a
            # `glibc` builds with cargo-zigbuild, which links against that
            # glibc's symbol versions instead of the runner's. Every
            # *-linux-gnu row needs one: "Check glibc floor" fails without it.
            glibc: "2.17"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: wowlua_ls
            glibc: "2.17"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: wowlua_ls
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: wowlua_ls
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: wowlua_ls.exe

    runs-on: ${{ matrix.os }}
    env:
      # `cargo zigbuild --target <target>.<glibc>` for a row with a glibc
      # floor, plain `cargo build` otherwise. Output lands in
      # target/<target>/release either way.
      RELEASE_BUILD: ${{ matrix.glibc && format('zigbuild --target {0}.{1}', matrix.target, matrix.glibc) || format('build --target {0}', matrix.target) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        # The version is pinned in rust-toolchain.toml for reproducible,
        # warning-stable builds (see the zero-warnings policy in Cargo.toml).
        # Install that exact toolchain, then add this matrix entry's target.
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild
        # Zig supplies the C compiler and linker for the floor's glibc: its
        # headers and symbol-version stubs, so neither the C dependencies
        # (vendored Lua, zstd, mimalloc) nor the link pick up the runner's
        # newer glibc. Pinned, like the Rust toolchain; cargo-zigbuild runs
        # zig as `python3 -m ziglang`, found through the venv on PATH.
        if: matrix.glibc
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/pip" install ziglang==0.17.1 cargo-zigbuild==0.24.1
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TABLE='/^\[workspace\.package]/,/^\[/'
          sed -i.bak "${TABLE}s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          sed -n "${TABLE}p" Cargo.toml | grep "^version = \"$VERSION\""

      - name: Build standalone binary (embedded stubs)
        run: cargo ${{ env.RELEASE_BUILD }} --release

      - name: Prepare standalone binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary }} wowlua_ls-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/${{ matrix.binary }} wowlua_ls-${{ matrix.target }}
          fi

      - name: Build editor binary (external stubs)
        run: cargo ${{ env.RELEASE_BUILD }} --release --no-default-features

      - name: Prepare editor binary for JetBrains
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary }} wowlua_ls-editor-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/${{ matrix.binary }} wowlua_ls-editor-${{ matrix.target }}
          fi

      - name: Check glibc floor
        # Fails when either binary needs a glibc symbol version newer than
        # the row's floor, and when a *-linux-gnu row sets no floor at all.
        # Built against the runner's glibc, v0.38.0 needed GLIBC_2.38 (the C
        # dependencies' `__isoc23_strtol`) and GLIBC_2.39 (std's
        # `pidfd_spawnp`), so it didn't start on Ubuntu 22.04 or Debian 12.
        if: contains(matrix.target, '-linux-gnu')
        run: >-
          .github/scripts/check-glibc-floor.sh "${{ matrix.glibc }}"
          wowlua_ls-${{ matrix.target }} wowlua_ls-editor-${{ matrix.target }}

      - name: Run on the glibc floor
        # Runs both binaries on CentOS 7, whose glibc is 2.17, the floor set
        # above (change the two together). Each checks a one-file workspace:
        # the standalone binary from its embedded stubs, the editor binary
        # from the checked-out stubs/ beside it. The workspace's plugin warns
        # once, from the vendored Lua, so `check` must exit 1 with that
        # warning.
        if: contains(matrix.target, '-linux-gnu')
        shell: bash
        run: |
          mkdir smoke
          echo 'local unit = { name = UnitName("player") }' > smoke/main.lua
          echo '{ "plugins": ["./plugin.lua"] }' > smoke/.wowluarc.json
          cat > smoke/plugin.lua <<'EOF'
          return {
            code = "smoke",
            run = function(ctx)
              for _, var in ipairs(ctx:find_locals({ init = "table" })) do
                ctx:warn(var.range, "Lua ran: " .. tonumber("ff", 16))
              end
            end,
          }
          EOF
          docker run --rm -v "$PWD:/io" -w /io centos:7 bash -euo pipefail -c '
            getconf GNU_LIBC_VERSION
            for bin in ./wowlua_ls-${{ matrix.target }} ./wowlua_ls-editor-${{ matrix.target }}; do
              $bin --version
              out=$($bin check smoke 2>&1) && status=0 || status=$?
              echo "$out"
              [[ $status == 1 && $out == *"Lua ran: 255"* ]]
            done
          '

      - name: Upload standalone binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: wowlua_ls-${{ matrix.target }}*

      - name: Upload editor binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-binary-${{ matrix.target }}
          path: wowlua_ls-editor-${{ matrix.target }}*

  build-vsix:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download editor binaries
        uses: actions/download-artifact@v4
        with:
          pattern: editor-binary-*
          merge-multiple: true
          path: binaries

      - name: Prepare universal extension
        shell: bash
        run: |
          cd editors/vscode
          mkdir -p server/stubs
          cp ../../stubs/precomputed.bin.zst server/stubs/
          cp ../../stubs/precomputed-files.bin.zst server/stubs/
          for spec in \
            "x86_64-unknown-linux-gnu:linux-x64:wowlua_ls" \
            "aarch64-unknown-linux-gnu:linux-arm64:wowlua_ls" \
            "x86_64-apple-darwin:darwin-x64:wowlua_ls" \
            "aarch64-apple-darwin:darwin-arm64:wowlua_ls" \
            "x86_64-pc-windows-msvc:win32-x64:wowlua_ls.exe"; do
            IFS=: read -r target platform binary <<< "$spec"
            mkdir -p server/${platform}
            cp ../../binaries/wowlua_ls-editor-${target}* server/${platform}/${binary}
            chmod +x server/${platform}/${binary}
          done

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd editors/vscode
          npm version "$VERSION" --no-git-tag-version

      - name: Package universal VSIX
        shell: bash
        run: |
          cd editors/vscode
          npm install
          npm run build
          npx @vscode/vsce package -o ../../wowlua-ls.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: wowlua-ls.vsix

  build-jetbrains:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download editor binaries
        uses: actions/download-artifact@v4
        with:
          pattern: editor-binary-*
          merge-multiple: true
          path: binaries

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" editors/jetbrains/build.gradle.kts

      - name: Build plugin
        run: |
          cd editors/jetbrains
          ./gradlew buildPlugin

      - name: Bundle universal plugin with all platform binaries
        shell: bash
        run: |
          cd editors/jetbrains/build/distributions
          PLUGIN_ZIP=$(ls *.zip)
          unzip -q "$PLUGIN_ZIP" -d repack
          # Shared stubs directory (loaded at runtime by all platform binaries)
          mkdir -p repack/wowlua-ls/server/stubs
          cp ../../../../stubs/precomputed.bin.zst repack/wowlua-ls/server/stubs/
          cp ../../../../stubs/precomputed-files.bin.zst repack/wowlua-ls/server/stubs/
          for spec in \
            "x86_64-unknown-linux-gnu:linux-x64:wowlua_ls" \
            "aarch64-unknown-linux-gnu:linux-arm64:wowlua_ls" \
            "x86_64-apple-darwin:darwin-x64:wowlua_ls" \
            "aarch64-apple-darwin:darwin-arm64:wowlua_ls" \
            "x86_64-pc-windows-msvc:win32-x64:wowlua_ls.exe"; do
            IFS=: read -r target platform binary <<< "$spec"
            mkdir -p repack/wowlua-ls/server/${platform}
            cp ../../../../binaries/wowlua_ls-editor-${target}* repack/wowlua-ls/server/${platform}/${binary}
            chmod +x repack/wowlua-ls/server/${platform}/${binary}
          done
          (cd repack && zip -qr ../wowlua-ls-jetbrains.zip wowlua-ls/)

      - name: Upload JetBrains plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: editors/jetbrains/build/distributions/wowlua-ls-jetbrains.zip

  release:
    needs: [build, build-vsix, build-jetbrains]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Download JetBrains plugin
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-plugin

      - name: Generate checksums
        run: sha256sum *.vsix *.zip wowlua_ls-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
            *.zip
            wowlua_ls-*
            checksums.txt
          body_path: RELEASE_NOTES.md

  notify-discord:
    needs: release
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Post release notes to Discord
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${VERSION}"
          FULL=$(cat RELEASE_NOTES.md)
          if [ ${#FULL} -gt 3900 ]; then
            BODY="${FULL:0:3900}"
            # Truncate to last complete line
            BODY="${BODY%$'\n'*}"
            BODY="${BODY}"$'\n\n'"[… view full release notes](${RELEASE_URL})"
          else
            BODY="$FULL"
          fi

          jq -n \
            --arg title "wowlua_ls ${VERSION}" \
            --arg desc "$BODY" \
            --arg url "$RELEASE_URL" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: 5814783}]}' \
          | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

  publish:
    needs: build-vsix
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Install vsce
        run: npm install -g @vscode/vsce@^3

      - name: Publish to VS Code Marketplace
        run: vsce publish --packagePath wowlua-ls.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    needs: build-vsix
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        run: npx ovsx@^0.10 publish wowlua-ls.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  publish-jetbrains:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download JetBrains plugin
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-plugin

      - name: Publish to JetBrains Marketplace
        run: |
          curl -sf \
            -H "Authorization: Bearer ${JETBRAINS_MARKETPLACE_TOKEN}" \
            -F "xmlId=com.tradeskillmaster.wowlua-ls" \
            -F "file=@wowlua-ls-jetbrains.zip" \
            -F "channel=stable" \
            "https://plugins.jetbrains.com/api/updates/upload"
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
